[project]
name = "garmin-excel"
version = "0.1.0"
description = "Import a weekly Excel running plan into the Garmin Connect calendar"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
]

[project.scripts]
garmin-excel = "garmin_excel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_excel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
